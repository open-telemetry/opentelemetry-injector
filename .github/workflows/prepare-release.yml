name: Automation - Prepare Release

on:
  workflow_dispatch:
    inputs:
      override:
        description: |
          Override the auto-derived bump. Leave as "auto" to derive from
          chloggen entries in .chloggen/, or force a specific bump kind.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
      prerelease:
        description: |
          When true, release the next release candidate for the computed
          version instead of the stable release, tagging v<computed>-rc.<N>
          where N is one greater than the highest existing rc index for the
          same base version (or 1 if no prior rc exists).
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  # Releasing opentelemetry-injector
  prepare-release:
    permissions:
      contents: write # required for pushing changes in prepare-release.sh
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: otelbot-token
        with:
          client-id: ${{ vars.OTELBOT_INJECTOR_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_INJECTOR_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] v7.0.1; persisted App token pushes the release branch
        with:
          token: ${{ steps.otelbot-token.outputs.token }}
          fetch-tags: true
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.27.4"
          cache: false
      - name: Determine next release version
        id: version
        env:
          OVERRIDE: ${{ inputs.override }}
          PRERELEASE: ${{ inputs.prerelease }}
        working-directory: ./tooling/nextversion
        run: |
          go run . \
            -override "$OVERRIDE" \
            -prerelease="$PRERELEASE" \
            -chloggen-dir ../../.chloggen
      - name: Prepare release for injector
        env:
          GITHUB_TOKEN: ${{ steps.otelbot-token.outputs.token }}
          REPO: open-telemetry/opentelemetry-injector
          VERSION: ${{ steps.version.outputs.version }}
        run: ./.github/workflows/scripts/prepare-release.sh
