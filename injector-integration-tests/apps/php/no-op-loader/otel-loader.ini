; No-op stand-in for the OpenTelemetry PHP universal loader's ini file.
;
; The injector only checks that this file exists before pointing PHP_INI_SCAN_DIR at its
; directory, so these tests can exercise the whole injector-side contract without building a
; C extension. Setting a harmless, observable ini directive lets the test app prove that PHP
; really did scan this directory, rather than merely that the variable was set.
user_agent="otel-injector-php-no-op-loader"
